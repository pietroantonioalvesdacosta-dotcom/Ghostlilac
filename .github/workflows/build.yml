name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: unzip -q ghostlilac.zip
      - run: cd ghostlilac && gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ghostlilac-mod
          path: |
            ghostlilac/build/libs/*.jar
            !ghostlilac/build/libs/*-sources.jar
